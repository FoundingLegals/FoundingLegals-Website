<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDFCF9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2B2723" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Paper Container -->
  <rect x="20" y="20" width="560" height="760" rx="16" fill="url(#paperGrad)" stroke="#E2DED0" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Header Bar -->
  <rect x="50" y="50" width="500" height="4" fill="#5A7338"/>
  <text x="50" y="75" font-family="sans-serif" font-size="11" font-weight="700" fill="#5A7338" letter-spacing="2">FOUNDINGLEGALS VETTED TEMPLATE</text>
  <text x="550" y="75" font-family="monospace" font-size="11" fill="#88857B" text-anchor="end">FL-2026-TRAD</text>
  
  <line x1="50" y1="90" x2="550" y2="90" stroke="#E2DED0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="300" y="130" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#1A1917" text-anchor="middle" letter-spacing="1">TRADEMARK LICENSE AGREEMENT</text>
  <text x="300" y="150" font-family="sans-serif" font-size="11" font-style="italic" fill="#6B6965" text-anchor="middle">Sample Legal Document Template · PROTECT YOUR IP</text>
  
  <line x1="200" y1="165" x2="400" y2="165" stroke="#5A7338" stroke-width="2"/>

  <!-- Document Body Text Simulation -->
  <g font-family="Georgia, serif" font-size="12" fill="#3A3732">
    <!-- Preamble -->
    <text x="50" y="200" font-style="italic" fill="#55524A">This Lease &amp; Rental Agreement is made between Lessor and Lessee</text>
    <text x="50" y="218" font-style="italic" fill="#55524A">pursuant to the Transfer of Property Act and Indian Rent Control laws.</text>

    <!-- Article 1 -->
    <text x="50" y="260" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1A1917" letter-spacing="1">ARTICLE 1: PROPERTY DEMISE &amp; MONTHLY RENT</text>
    <rect x="50" y="275" width="500" height="8" rx="2" fill="#EAE6DA"/>
    <rect x="50" y="290" width="460" height="8" rx="2" fill="#EAE6DA"/>
    <rect x="50" y="305" width="480" height="8" rx="2" fill="#EAE6DA"/>

    <!-- Article 2 -->
    <text x="50" y="345" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1A1917" letter-spacing="1">ARTICLE 2: SECURITY DEPOSIT &amp; TENURE</text>
    <rect x="50" y="360" width="490" height="8" rx="2" fill="#EAE6DA"/>
    <rect x="50" y="375" width="440" height="8" rx="2" fill="#EAE6DA"/>
    <rect x="50" y="390" width="500" height="8" rx="2" fill="#EAE6DA"/>

    <!-- Article 3 -->
    <text x="50" y="430" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1A1917" letter-spacing="1">ARTICLE 3: MAINTENANCE, UTILITIES &amp; USAGE</text>
    <rect x="50" y="445" width="470" height="8" rx="2" fill="#EAE6DA"/>
    <rect x="50" y="460" width="500" height="8" rx="2" fill="#EAE6DA"/>
    <rect x="50" y="475" width="430" height="8" rx="2" fill="#EAE6DA"/>

    <!-- Article 4 -->
    <text x="50" y="515" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1A1917" letter-spacing="1">ARTICLE 4: TERMINATION, NOTICE &amp; LOCK-IN</text>
    <rect x="50" y="530" width="500" height="8" rx="2" fill="#EAE6DA"/>
    <rect x="50" y="545" width="450" height="8" rx="2" fill="#EAE6DA"/>
  </g>

  <!-- Signature Box -->
  <line x1="50" y1="600" x2="550" y2="600" stroke="#E2DED0" stroke-width="1.5"/>
  
  <g font-family="sans-serif" font-size="11">
    <!-- Party A -->
    <line x1="50" y1="670" x2="240" y2="670" stroke="#88857B" stroke-dasharray="4 4"/>
    <text x="50" y="690" font-weight="bold" fill="#1A1917">LESSOR (LANDLORD)</text>
    <text x="50" y="705" fill="#88857B">Authorized Signature &amp; Seal</text>

    <!-- Party B -->
    <line x1="360" y1="670" x2="550" y2="670" stroke="#88857B" stroke-dasharray="4 4"/>
    <text x="360" y="690" font-weight="bold" fill="#1A1917">LESSEE (TENANT)</text>
    <text x="360" y="705" fill="#88857B">Authorized Signature &amp; Seal</text>
  </g>

  <!-- Footer Watermark -->
  <text x="300" y="750" font-family="sans-serif" font-size="10" fill="#AAAAAA" text-anchor="middle">SAMPLE TEMPLATE PREVIEW · FOR DISPLAY PURPOSES ONLY</text>
</svg>